name: Generate Galaga Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate galaga contribution graph
        uses: Manikeshmk/galaga-contribution-graph@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy SVG to output dir
        run: |
          mkdir -p output
          cp "${{ github.action_path }}/dist/galaga.svg" output/galaga-contribution-graph-dark.svg 2>/dev/null || true

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output
          publish_branch: output
          force_orphan: true
