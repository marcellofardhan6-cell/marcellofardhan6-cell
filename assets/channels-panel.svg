<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80">
  <defs>
    <linearGradient id="ch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080B12"/>
      <stop offset="100%" style="stop-color:#0D1B2A"/>
    </linearGradient>
    <filter id="ch-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="80" fill="url(#ch-bg)" rx="12"/>
  <rect x="1" y="1" width="798" height="78" rx="11" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0.3"/>

  <text x="400" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#F59E0B" filter="url(#ch-glow)">
    <tspan opacity="0.5">///</tspan>
    <tspan dx="10">OPEN CHANNELS</tspan>
    <tspan dx="10" opacity="0.5">///</tspan>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </text>

  <line x1="300" y1="40" x2="500" y2="40" stroke="#F59E0B" stroke-width="0.5" opacity="0.3"/>

  <text x="400" y="60" text-anchor="middle" font-family="monospace" font-size="10" fill="#94A3B8">
    <tspan fill="#F59E0B">Let's connect</tspan>
    <tspan dx="10" fill="#64748B">|</tspan>
    <tspan dx="10">Always open for collaboration</tspan>
  </text>
</svg>