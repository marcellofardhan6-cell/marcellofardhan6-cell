<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#080B12"/>
      <stop offset="50%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#080B12"/>
    </linearGradient>
    <filter id="footer-glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="footer-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#22D3EE;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="100" fill="url(#footer-bg)"/>

  <!-- Matrix rain columns -->
  <g font-family="monospace" font-size="10" fill="#22D3EE" opacity="0.15">
    <text x="30" y="20"><animate attributeName="y" values="0;100;0" dur="3s" repeatCount="indefinite"/>0</text>
    <text x="30" y="50"><animate attributeName="y" values="20;100;20" dur="3s" repeatCount="indefinite" begin="0.2s"/>1</text>
    <text x="30" y="80"><animate attributeName="y" values="40;100;40" dur="3s" repeatCount="indefinite" begin="0.4s"/>0</text>

    <text x="80" y="10"><animate attributeName="y" values="10;100;10" dur="3.5s" repeatCount="indefinite" begin="0.1s"/>1</text>
    <text x="80" y="40"><animate attributeName="y" values="30;100;30" dur="3.5s" repeatCount="indefinite" begin="0.3s"/>1</text>
    <text x="80" y="70"><animate attributeName="y" values="60;100;60" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>0</text>

    <text x="130" y="25"><animate attributeName="y" values="5;100;5" dur="2.8s" repeatCount="indefinite" begin="0.15s"/>0</text>
    <text x="130" y="55"><animate attributeName="y" values="35;100;35" dur="2.8s" repeatCount="indefinite" begin="0.35s"/>1</text>
    <text x="130" y="85"><animate attributeName="y" values="65;100;65" dur="2.8s" repeatCount="indefinite" begin="0.55s"/>1</text>

    <text x="670" y="15"><animate attributeName="y" values="0;100;0" dur="3.2s" repeatCount="indefinite" begin="0.2s"/>1</text>
    <text x="670" y="45"><animate attributeName="y" values="25;100;25" dur="3.2s" repeatCount="indefinite" begin="0.4s"/>0</text>
    <text x="670" y="75"><animate attributeName="y" values="55;100;55" dur="3.2s" repeatCount="indefinite" begin="0.6s"/>1</text>

    <text x="720" y="30"><animate attributeName="y" values="10;100;10" dur="2.9s" repeatCount="indefinite" begin="0.25s"/>0</text>
    <text x="720" y="60"><animate attributeName="y" values="40;100;40" dur="2.9s" repeatCount="indefinite" begin="0.45s"/>1</text>
    <text x="720" y="90"><animate attributeName="y" values="70;100;70" dur="2.9s" repeatCount="indefinite" begin="0.65s"/>0</text>

    <text x="770" y="20"><animate attributeName="y" values="5;100;5" dur="3.1s" repeatCount="indefinite" begin="0.3s"/>1</text>
    <text x="770" y="50"><animate attributeName="y" values="35;100;35" dur="3.1s" repeatCount="indefinite" begin="0.5s"/>0</text>
    <text x="770" y="80"><animate attributeName="y" values="65;100;65" dur="3.1s" repeatCount="indefinite" begin="0.7s"/>1</text>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="800" height="1" fill="url(#footer-line)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Main content -->
  <text x="400" y="45" text-anchor="middle" font-family="monospace" font-size="11" fill="#94A3B8" filter="url(#footer-glow)">
    <tspan fill="#22D3EE">42</tspan> repositories
    <tspan dx="5" fill="#F59E0B">|</tspan>
    <tspan dx="5">Crafted with</tspan>
    <tspan dx="5" fill="#EF4444">
      <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
      heart
    </tspan>
    <tspan dx="5">and</tspan>
    <tspan dx="5" fill="#22D3EE">code</tspan>
  </text>

  <text x="400" y="65" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748B">
    <tspan fill="#22D3EE">marcellofardhan6-cell</tspan>
    <tspan dx="8" fill="#F59E0B">@</tspan>
    <tspan dx="8">GitHub</tspan>
    <tspan dx="8" fill="#22D3EE">2026</tspan>
  </text>

  <!-- Bottom decorative elements -->
  <g opacity="0.4">
    <line x1="200" y1="80" x2="600" y2="80" stroke="#22D3EE" stroke-width="0.3"/>
    <circle cx="200" cy="80" r="2" fill="#22D3EE">
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="80" r="2" fill="#22D3EE">
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="400" cy="80" r="2" fill="#F59E0B">
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>

  <!-- Animated dots pattern -->
  <g fill="#22D3EE" opacity="0.1">
    <circle cx="150" cy="90" r="1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="92" r="1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="350" cy="88" r="1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite" begin="0.6s"/></circle>
    <circle cx="450" cy="92" r="1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite" begin="0.9s"/></circle>
    <circle cx="550" cy="90" r="1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite" begin="1.2s"/></circle>
  </g>
</svg>