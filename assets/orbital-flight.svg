<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="800" height="60">
  <defs>
    <linearGradient id="orb-track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#22D3EE;stop-opacity:0.3"/>
      <stop offset="70%" style="stop-color:#22D3EE;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="60" fill="#080B12"/>

  <!-- Orbital track -->
  <line x1="50" y1="30" x2="750" y2="30" stroke="url(#orb-track)" stroke-width="1"/>

  <!-- Dashed orbit -->
  <line x1="50" y1="30" x2="750" y2="30" stroke="#22D3EE" stroke-width="0.5" stroke-dasharray="6 10" opacity="0.3">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- Spacecraft flying across using nested animate on translate -->
  <g>
    <!-- Ship group with flight -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-30,30;830,30" dur="6s" repeatCount="indefinite"/>
      <!-- Ship body -->
      <polygon points="0,-4 12,0 0,4 -2,2 -2,-2" fill="#22D3EE"/>
      <!-- Engine glow -->
      <ellipse cx="-4" cy="0" rx="4" ry="1.5" fill="#F59E0B" opacity="0.8">
        <animate attributeName="rx" values="4;6;4" dur="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="0.3s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Trail -->
      <line x1="-6" y1="0" x2="-30" y2="0" stroke="#22D3EE" stroke-width="1" opacity="0.4">
        <animate attributeName="x2" values="-30;-50;-30" dur="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="0.4s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- Stars -->
  <circle cx="100" cy="15" r="0.8" fill="#F8FAFC" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="45" r="0.6" fill="#F8FAFC" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="400" cy="12" r="0.7" fill="#F8FAFC" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="550" cy="48" r="0.5" fill="#F8FAFC" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="700" cy="20" r="0.8" fill="#F8FAFC" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="150" cy="38" r="0.5" fill="#22D3EE" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.2s" repeatCount="indefinite" begin="0.7s"/>
  </circle>
  <circle cx="600" cy="10" r="0.6" fill="#F59E0B" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.2s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
</svg>