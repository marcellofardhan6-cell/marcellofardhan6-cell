<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080B12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0D1B2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080B12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="text-clip">
      <rect x="0" y="0" width="800" height="320"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#bg-grad)"/>

  <!-- Grid lines -->
  <g opacity="0.08">
    <line x1="0" y1="40" x2="800" y2="40" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="800" y2="80" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="800" y2="280" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="320" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="320" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="320" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="320" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="320" stroke="#22D3EE" stroke-width="0.5"/>
  </g>

  <!-- Floating particles -->
  <circle cx="50" cy="30" r="1.5" fill="#22D3EE" opacity="0.6">
    <animate attributeName="cy" values="30;280;30" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="100" r="1" fill="#F59E0B" opacity="0.5">
    <animate attributeName="cy" values="100;20;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="50" r="1.5" fill="#22D3EE" opacity="0.4">
    <animate attributeName="cy" values="50;250;50" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="200" r="1" fill="#F59E0B" opacity="0.5">
    <animate attributeName="cy" values="200;50;200" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="290" r="1.2" fill="#22D3EE" opacity="0.3">
    <animate attributeName="cy" values="290;30;290" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="160" r="0.8" fill="#F59E0B" opacity="0.6">
    <animate attributeName="cy" values="160;60;160" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Horizontal scan line -->
  <rect x="0" y="0" width="800" height="2" fill="#22D3EE" opacity="0.15">
    <animate attributeName="y" values="0;318;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner decorations -->
  <g stroke="#22D3EE" stroke-width="1" fill="none" opacity="0.5">
    <!-- Top-left -->
    <path d="M 20 20 L 20 40 M 20 20 L 40 20">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Top-right -->
    <path d="M 780 20 L 780 40 M 780 20 L 760 20">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <!-- Bottom-left -->
    <path d="M 20 300 L 20 280 M 20 300 L 40 300">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1s"/>
    </path>
    <!-- Bottom-right -->
    <path d="M 780 300 L 780 280 M 780 300 L 760 300">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </path>
  </g>

  <!-- Terminal prompt -->
  <g transform="translate(120, 100)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="560" height="140" rx="8" fill="#0D1117" stroke="#22D3EE" stroke-width="1" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- Terminal header bar -->
    <rect x="0" y="0" width="560" height="28" rx="8" fill="#161B22" opacity="0.95"/>
    <rect x="0" y="20" width="560" height="8" fill="#161B22"/>
    <!-- Traffic lights -->
    <circle cx="20" cy="14" r="5" fill="#FF5F56">
      <animate attributeName="opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="14" r="5" fill="#FFBD2E">
      <animate attributeName="opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="56" cy="14" r="5" fill="#27C93F">
      <animate attributeName="opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <!-- Terminal title -->
    <text x="280" y="18" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="11">fardhan@github ~ %</text>

    <!-- Command line -->
    <text x="20" y="60" fill="#22D3EE" font-family="monospace" font-size="14" filter="url(#glow)">
      <tspan>$</tspan>
      <tspan dx="8" fill="#F8FAFC">echo</tspan>
      <tspan dx="8" fill="#F8FAFC">"Welcome to my universe"</tspan>
      <animate attributeName="opacity" values="1;1;1" dur="0.1s" fill="freeze"/>
    </text>

    <!-- Typing cursor -->
    <rect x="352" y="46" width="2" height="16" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Name line -->
    <text x="20" y="90" fill="#F59E0B" font-family="monospace" font-size="14" filter="url(#glow)">
      <tspan> greet </tspan>
      <tspan fill="#22D3EE">"Fardhan Marcello"</tspan>
      <animate attributeName="opacity" values="1;1;1" dur="0.1s" fill="freeze"/>
    </text>

    <!-- Subtitle line -->
    <text x="20" y="115" fill="#94A3B8" font-family="monospace" font-size="12">
      <tspan fill="#F59E0B">&gt;</tspan>
      <tspan dx="8">Full-Stack Developer</tspan>
      <tspan dx="10" fill="#64748B">|</tspan>
      <tspan dx="10">Crafting Digital Experiences</tspan>
      <tspan dx="10" fill="#64748B">|</tspan>
      <tspan dx="10">Problem Solver</tspan>
    </text>

    <!-- Blinking prompt -->
    <rect x="20" y="125" width="8" height="2" fill="#22D3EE" rx="1">
      <animate attributeName="width" values="8;16;8" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Decorative circuit lines -->
  <g stroke="#22D3EE" stroke-width="0.5" fill="none" opacity="0.3">
    <path d="M 0 250 Q 100 240 150 260 T 300 250">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 500 270 Q 600 260 650 280 T 800 260">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </path>
  </g>

  <!-- Glitch text effect overlay -->
  <g clip-path="url(#text-clip)">
    <text x="400" y="155" text-anchor="middle" font-family="monospace" font-size="10" fill="#22D3EE" opacity="0">
      <animate attributeName="opacity" values="0;0;0.15;0;0;0;0.1;0;0" dur="3s" repeatCount="indefinite"/>
      FARDHAN MARCELLO
      <animate attributeName="x" values="400;402;398;400" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Bottom accent line -->
  <rect x="120" y="250" width="560" height="1" fill="url(#cyan-grad)" opacity="0.4">
    <animate attributeName="width" values="0;560" dur="2s" fill="freeze"/>
  </rect>
  <rect x="120" y="252" width="560" height="1" fill="#F59E0B" opacity="0.2">
    <animate attributeName="width" values="0;560" dur="2s" fill="freeze" begin="0.3s"/>
  </rect>
</svg>