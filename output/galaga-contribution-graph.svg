<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="gal-bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F6F8FA"/>
      <stop offset="100%" style="stop-color:#E9EDF1"/>
    </linearGradient>
    <filter id="gal-glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#gal-bg2)" rx="12"/>
  <rect x="1" y="1" width="798" height="398" rx="11" fill="none" stroke="#22D3EE" stroke-width="0.5" opacity="0.4"/>

  <text x="400" y="40" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#22D3EE" filter="url(#gal-glow2)">
    GALAGA CONTRIBUTION GRAPH
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </text>
  <line x1="280" y1="52" x2="520" y2="52" stroke="#22D3EE" stroke-width="0.5" opacity="0.4"/>

  <g>
    <g fill="#22D3EE">
      <rect x="200" y="90" width="14" height="14" rx="2" opacity="0.9"/>
      <rect x="218" y="90" width="14" height="14" rx="2" opacity="0.7"/>
      <rect x="200" y="108" width="14" height="14" rx="2" opacity="0.8"/>
      <rect x="218" y="108" width="14" height="14" rx="2" opacity="0.6"/>
      <rect x="200" y="126" width="14" height="14" rx="2" opacity="0.7"/>
      <rect x="236" y="108" width="14" height="14" rx="2" opacity="0.5"/>
      <rect x="300" y="90" width="14" height="14" rx="2" opacity="0.9"/>
      <rect x="318" y="90" width="14" height="14" rx="2" opacity="0.7"/>
      <rect x="300" y="108" width="14" height="14" rx="2" opacity="0.8"/>
      <rect x="318" y="108" width="14" height="14" rx="2" opacity="0.9"/>
      <rect x="300" y="126" width="14" height="14" rx="2" opacity="0.7"/>
      <rect x="318" y="126" width="14" height="14" rx="2" opacity="0.6"/>
      <rect x="400" y="90" width="14" height="14" rx="2" opacity="0.6"/>
      <rect x="418" y="90" width="14" height="14" rx="2" opacity="0.8"/>
      <rect x="400" y="108" width="14" height="14" rx="2" opacity="0.9"/>
      <rect x="418" y="108" width="14" height="14" rx="2" opacity="0.7"/>
      <rect x="400" y="126" width="14" height="14" rx="2" opacity="0.5"/>
      <rect x="500" y="90" width="14" height="14" rx="2" opacity="0.8"/>
      <rect x="500" y="108" width="14" height="14" rx="2" opacity="0.7"/>
      <rect x="500" y="126" width="14" height="14" rx="2" opacity="0.9"/>
      <rect x="580" y="90" width="14" height="14" rx="2" opacity="0.7"/>
      <rect x="598" y="90" width="14" height="14" rx="2" opacity="0.9"/>
      <rect x="580" y="108" width="14" height="14" rx="2" opacity="0.8"/>
      <rect x="598" y="108" width="14" height="14" rx="2" opacity="0.6"/>
      <rect x="150" y="150" width="14" height="14" rx="2" opacity="0.6"/>
      <rect x="250" y="150" width="14" height="14" rx="2" opacity="0.8"/>
      <rect x="350" y="150" width="14" height="14" rx="2" opacity="0.7"/>
      <rect x="450" y="150" width="14" height="14" rx="2" opacity="0.9"/>
      <rect x="550" y="150" width="14" height="14" rx="2" opacity="0.6"/>
      <rect x="628" y="150" width="14" height="14" rx="2" opacity="0.5"/>
    </g>
    <g fill="#F59E0B">
      <rect x="200" y="170" width="14" height="14" rx="2" opacity="0.7"/>
      <rect x="300" y="170" width="14" height="14" rx="2" opacity="0.6"/>
      <rect x="400" y="170" width="14" height="14" rx="2" opacity="0.8"/>
      <rect x="500" y="170" width="14" height="14" rx="2" opacity="0.7"/>
    </g>
    <g fill="#EF4444">
      <rect x="250" y="190" width="14" height="14" rx="2" opacity="0.6"/>
      <rect x="450" y="190" width="14" height="14" rx="2" opacity="0.5"/>
    </g>
    <g>
      <rect x="200" y="90" width="14" height="14" rx="2" fill="#0969DA">
        <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" repeatCount="indefinite" begin="0s"/>
      </rect>
      <rect x="318" y="108" width="14" height="14" rx="2" fill="#0969DA">
        <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
      </rect>
      <rect x="450" y="150" width="14" height="14" rx="2" fill="#0969DA">
        <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
      </rect>
      <rect x="598" y="90" width="14" height="14" rx="2" fill="#0969DA">
        <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
      </rect>
    </g>
  </g>

  <!-- Player ship -->
  <g transform="translate(400, 300)">
    <polygon points="0,-14 8,0 0,6 -8,0" fill="#22D3EE" filter="url(#gal-glow2)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="-3,6 3,6 0,16" fill="#F59E0B" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="0.2s" repeatCount="indefinite"/>
      <animate attributeName="points" values="-3,6 3,6 0,16;-3,6 3,6 -1,24;-3,6 3,6 0,16" dur="0.2s" repeatCount="indefinite"/>
    </polygon>
    <animateTransform attributeName="transform" type="translate" values="400,300;360,300;420,300;400,300" dur="4s" repeatCount="indefinite"/>
  </g>

  <line x1="400" y1="280" x2="400" y2="210" stroke="#22D3EE" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="0.5s"/>
  </line>

  <g fill="#57606A" font-family="monospace" font-size="8">
    <text x="150" y="170">Jan</text>
    <text x="250" y="170">Mar</text>
    <text x="350" y="170">May</text>
    <text x="450" y="170">Jul</text>
    <text x="550" y="170">Sep</text>
    <text x="628" y="170">Nov</text>
  </g>

  <g transform="translate(200, 330)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#22D3EE" opacity="0.4"/>
    <text x="14" y="9" font-family="monospace" font-size="9" fill="#57606A">Less</text>
    <rect x="70" y="0" width="10" height="10" rx="2" fill="#F59E0B" opacity="0.7"/>
    <text x="84" y="9" font-family="monospace" font-size="9" fill="#57606A">Active</text>
    <rect x="140" y="0" width="10" height="10" rx="2" fill="#EF4444" opacity="0.6"/>
    <text x="154" y="9" font-family="monospace" font-size="9" fill="#57606A">Hot</text>
  </g>

  <text x="400" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#22D3EE">
    <tspan>SCORE:</tspan>
    <tspan dx="6" fill="#116329">
      <animate attributeName="opacity" values="1;0.4;1" dur="0.3s" repeatCount="indefinite"/>
      ALL CONTRIBUTIONS
    </tspan>
    <tspan dx="6" fill="#22D3EE">HI-SCORE</tspan>
  </text>
</svg>